<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#02040c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="app-version" content="1.1">
<title>¡Boom! 3D · El juego (fan-made)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menu.css">
<style>:root{--m-icono:"💣"}</style>
</head>
<body>
<div id="app"></div>
<div id="hud" class="hidden">
  <div class="marc l0"><div class="n"></div><div class="d"></div><div class="j"></div><div class="v"></div></div>
  <div class="centro"><div id="timer"></div><div id="roundTxt"></div></div>
  <div class="marc l1"><div class="n"></div><div class="d"></div><div class="j"></div><div class="v"></div></div>
</div>
<div id="hashtag"></div>
<div id="bubble" class="hidden"></div>
<div id="lower3" class="hidden"></div>
<div id="credits" class="hidden"><div id="creditsRoll"></div></div>
<div id="toast" class="hidden"></div>
<div id="marcador" class="hidden"></div>
<div id="topbar" class="hidden">
  <button id="btnMenu" title="Menú">☰</button>
  <button id="btnCam" title="Cámara">👁</button>
  <button id="btnLuces" title="Luces">💡</button>
  <button id="btnSkip" class="hidden">Saltar ⏭</button>
</div>
<div id="glights" class="hidden"></div>
<div id="hint" class="hidden"></div>
<div id="actions"></div>
<div id="qpanel" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<div id="cabTexto"></div>
<div id="fx-flash"></div><div id="fx-fade"></div>
<div id="video" class="hidden"><video playsinline></video></div>
<div id="menu"></div>
<div id="loading"><div class="ld-bomba">💣</div><p>Cargando el plató…</p></div>
<div id="rotate">Gira el móvil 📱↻</div>
<script src="data/preguntas_extra.js"></script>
<script src="js/app.js"></script>
</body>
</html>
